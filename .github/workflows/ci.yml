name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bamfa
          POSTGRES_USER: bamfa
          POSTGRES_PASSWORD: bamfa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bamfa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      DJANGO_SECRET_KEY: ci-insecure-secret-key-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: pytest -v
